<h2>💼 工作值不值测算</h2>

<p>💰 平均日薪酬（元）</p>
<input id="salary" type="number" value="800">

<p>⏰ 平均日工作时长（小时）</p>
<input id="workHours" type="number" value="10">

<p>🚗 平均日通勤时长（小时）</p>
<input id="commuteHours" type="number" value="1.5">

<p>😴 平均日摸鱼时间（小时）</p>
<input id="lazyHours" type="number" value="2">

<p>🏢 工作环境系数</p>
<select id="envWork">
  <option value="0.8">偏僻地区 0.8</option>
  <option value="0.9">工厂户外 0.9</option>
  <option value="1.0" selected>普通 1.0</option>
  <option value="1.1">体制内 1.1</option>
</select>

<p>💑 异性环境系数</p>
<select id="envGender">
  <option value="0.9">没有 0.9</option>
  <option value="1.0" selected>不多不少 1.0</option>
  <option value="1.1">很多 1.1</option>
</select>

<p>👥 同事环境系数</p>
<select id="envColleague">
  <option value="0.95">SB很多 0.95</option>
  <option value="1.0" selected>普通 1.0</option>
  <option value="1.05">优秀很多 1.05</option>
</select>

<p>🎓 学历系数</p>
<select id="eduCoeff">
  <option value="0.8">专科及以下 0.8</option>
  <option value="1.0" selected>普通本科 1.0</option>
  <option value="1.2">高级本科 1.2</option>
  <option value="1.4">普通硕士 1.4</option>
  <option value="1.6">高级硕士 1.6</option>
  <option value="1.8">普通博士 1.8</option>
  <option value="2.0">高级博士 2.0</option>
</select>

<br><br>
<button onclick="calc()" style="padding:8px 16px;">计算工作性价比</button>

<p id="result" style="font-size:18px; font-weight:bold; margin-top:20px;"></p>

<script>
function calc() {
  // 1. 获取输入值
  let salary = parseFloat(document.getElementById("salary").value) || 0;
  let workHours = parseFloat(document.getElementById("workHours").value) || 0;
  let commuteHours = parseFloat(document.getElementById("commuteHours").value) || 0;
  let lazyHours = parseFloat(document.getElementById("lazyHours").value) || 0;

  // 2. 获取环境系数
  let envWork = parseFloat(document.getElementById("envWork").value);
  let envGender = parseFloat(document.getElementById("envGender").value);
  let envColleague = parseFloat(document.getElementById("envColleague").value);
  let eduCoeff = parseFloat(document.getElementById("eduCoeff").value);

  // 3. 计算综合环境系数（固定基数 1.05）
  let envTotal = 1.05 * envWork * envGender * envColleague;

  // 4. 分母：35*(工作+通勤-0.5*摸鱼) * 学历系数
  let timeTotal = workHours + commuteHours - 0.5 * lazyHours;
  let denominator = 35 * timeTotal * eduCoeff;

  // 5. 最终性价比
  let score = denominator === 0 ? 0 : (salary * envTotal) / denominator;
  score = Math.max(score, 0); // 防止负数

  // 6. 评价等级
  let level;
  if (score < 0.8) {
    level = "😵 很惨";
  } else if (score > 2.0) {
    level = "🤯 爽爆炸";
  } else if (score > 1.5) {
    level = "😄 很爽";
  } else {
    level = "😐 一般";
  }

  // 7. 显示结果
  document.getElementById("result").innerText = 
    `工作性价比：${score.toFixed(2)} | 评价：${level}`;
}
</script>
