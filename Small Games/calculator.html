<h2>工作性价比计算（简化版）</h2>

<p>💰 平均日薪（元）：</p>
<input id="salary" type="number" value="800">

<p>⏰ 工作时长 (小时)：</p>
<input id="work" type="number" value="10">

<p>🚗 通勤时长 (小时)：</p>
<input id="commute" type="number" value="1.5">

<p>😴 摸鱼时长 (小时)：</p>
<input id="lazy" type="number" value="2">

<button onclick="calc()">计算</button>

<h3>结果：</h3>
<div id="result">0</div>

<script>
function calc() {
  const salary = Number(document.getElementById("salary").value);
  const work = Number(document.getElementById("work").value);
  const commute = Number(document.getElementById("commute").value);
  const lazy = Number(document.getElementById("lazy").value);

  const env = 1.0;

  const totalTime = work + commute - 0.5 * lazy;
  const safeTime = totalTime > 0 ? totalTime : 0.1;

  const score = (salary * env) / (35 * safeTime);

  document.getElementById("result").innerText = score.toFixed(2);
}
</script>
