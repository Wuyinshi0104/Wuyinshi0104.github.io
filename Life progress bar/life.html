<style>
  .calc-container {
    max-width: 700px;
    margin: 30px auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .calc-container h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 24px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row label {
    font-size: 18px;
  }

  .form-row input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 16px;
  }

  .calc-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #4a90e2;
    color: #fff;
    border-radius: 8px;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }

  .calc-btn:hover {
    background: #357abd;
  }

  .progress-bar {
    width: 100%;
    height: 20px;
    background: #eee;
    border-radius: 10px;
    margin: 20px 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4a90e2, #6fc3ff);
    transition: width 0.6s ease;
  }

  .result-box {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
  }

  .desc {
    text-align: center;
    color: #666;
    margin-bottom: 10px;
  }
</style>

<div class="calc-container">
  <h2>💰 500万资产进度条</h2>
  <div class="desc">目标：500万 · 实时计算完成度</div>

  <div class="form-grid">
    <div class="form-row">
      <label>💴 现金（元）</label>
      <input id="cash" type="number" value="50000">
    </div>
    <div class="form-row">
      <label>📈 股票（元）</label>
      <input id="stock" type="number" value="0">
    </div>
    <div class="form-row">
      <label>📊 基金（元）</label>
      <input id="fund" type="number" value="0">
    </div>
    <div class="form-row">
      <label>🎯 目标金额（万）</label>
      <input id="target" type="number" value="500">
    </div>
  </div>

  <button class="calc-btn" onclick="calcAsset()">计算进度</button>

  <div class="progress-bar">
    <div id="progress" class="progress-fill"></div>
  </div>

  <div class="result-box" id="result">--</div>
</div>

<script>
function calcAsset() {
  const cash = Number(document.getElementById("cash").value) || 0;
  const stock = Number(document.getElementById("stock").value) || 0;
  const fund = Number(document.getElementById("fund").value) || 0;
  const targetWan = Number(document.getElementById("target").value) || 500;

  // 总资产
  const total = cash + stock + fund;
  // 目标：万元 → 元
  const target = targetWan * 10000;

  // 进度百分比
  const percent = Math.min(100, (total / target) * 100);
  const percentText = percent.toFixed(1);

  // 进度条
  document.getElementById("progress").style.width = percentText + "%";

  // 评价文字
  let text = '';
  if (percent < 10) text = `🌱 刚开始出发 ${percentText}%`;
  else if (percent < 30) text = `🌿 稳步积累 ${percentText}%`;
  else if (percent < 50) text = `📈 小有成就 ${percentText}%`;
  else if (percent < 80) text = `💎 接近目标 ${percentText}%`;
  else text = `🏆 目标达成！${percentText}%`;

  document.getElementById("result").innerText = text;
}

// 页面加载自动算一次
calcAsset();
</script>
